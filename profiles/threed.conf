# DESC: Image to 3D — mesh, texture, gaussian splat, multi-view
#
# Useful for video work even when you never ship a model: depth maps and
# multi-view generation are conditioning inputs for controlled video.
#
# 3D-Pack has the heaviest dependencies of any profile here. Install it on its
# own box -- it is the most likely to fight another profile's pins.
NODES=(
  "ComfyUI-KJNodes|https://github.com/kijai/ComfyUI-KJNodes"
  "ComfyUI-3D-Pack|https://github.com/MrForExample/ComfyUI-3D-Pack"
)
REQUIRED_NODES="ComfyUI-3D-Pack"
EXTRA_PIP="trimesh"
