# DESC: Build reference views of a person from few photos
#
# Solves the one-photo problem: PuLID conditions identity from a single image
# with no training, so you can generate the varied angles a swap model wants.
# Mix real photos with synthetic ones -- synthetic error is systematic, and
# a stack of same-wrong views reads to the model as truth.
NODES=(
  "ComfyUI-KJNodes|https://github.com/kijai/ComfyUI-KJNodes"
  "ComfyUI_essentials|https://github.com/cubiq/ComfyUI_essentials"
  "PuLID_ComfyUI|https://github.com/cubiq/PuLID_ComfyUI"
  "facerestore_cf|https://github.com/mav-rik/facerestore_cf"
)
REQUIRED_NODES="ComfyUI-KJNodes PuLID_ComfyUI"
EXTRA_PIP="insightface onnxruntime-gpu transformers accelerate"
