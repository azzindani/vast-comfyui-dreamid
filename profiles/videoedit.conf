# DESC: Edit real footage — inpaint, object removal, outpaint, restyle
#
# VACE unifies reference-to-video, v2v, inpainting and outpainting. SAM2 gives
# you masks that track across frames, which is the actual hard part.
NODES=(
  "ComfyUI-VideoHelperSuite|https://github.com/Kosinkadink/ComfyUI-VideoHelperSuite"
  "ComfyUI-KJNodes|https://github.com/kijai/ComfyUI-KJNodes"
  "ComfyUI-Wan-VACE-Prep|https://github.com/stuttlepress/ComfyUI-Wan-VACE-Prep"
  "ComfyUI-segment-anything-2|https://github.com/kijai/ComfyUI-segment-anything-2"
  "ComfyUI-RMBG|https://github.com/1038lab/ComfyUI-RMBG"
)
REQUIRED_NODES="ComfyUI-VideoHelperSuite ComfyUI-KJNodes"
EXTRA_PIP="imageio-ffmpeg av einops omegaconf"

# Wan 2.1 VACE 1.3B — the learning-sized option at ~4.3GB. The 14B is 34.7GB
# and Wan 2.2's fun-vace needs BOTH high- and low-noise halves (~17GB each),
# so start small: the pipeline is identical, only the quality differs.
MODELS=(
  "Comfy-Org/Wan_2.1_ComfyUI_repackaged|split_files/diffusion_models/wan2.1_vace_1.3B_fp16.safetensors|models/diffusion_models|wan2.1_vace_1.3B_fp16.safetensors|3800000000"
  "Comfy-Org/Wan_2.1_ComfyUI_repackaged|split_files/text_encoders/umt5_xxl_fp8_e4m3fn_scaled.safetensors|models/text_encoders|umt5_xxl_fp8_e4m3fn_scaled.safetensors|6000000000"
  "Comfy-Org/Wan_2.1_ComfyUI_repackaged|split_files/vae/wan_2.1_vae.safetensors|models/vae|wan_2.1_vae.safetensors|220000000"
)
MODELS_NOTE="For 14B quality: wan2.1_vace_14B_fp16.safetensors (34.7GB) from the same repo."
