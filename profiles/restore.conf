# DESC: Upscale, restore and retime footage
#
# Order matters: restore real frames FIRST, then interpolate, then encode.
# Interpolating first propagates artifacts into the frames you invent.
NODES=(
  "ComfyUI-VideoHelperSuite|https://github.com/Kosinkadink/ComfyUI-VideoHelperSuite"
  "ComfyUI-KJNodes|https://github.com/kijai/ComfyUI-KJNodes"
  "ComfyUI-SeedVR2_VideoUpscaler|https://github.com/numz/ComfyUI-SeedVR2_VideoUpscaler"
  "ComfyUI-Frame-Interpolation|https://github.com/Fannovel16/ComfyUI-Frame-Interpolation"
)
REQUIRED_NODES="ComfyUI-VideoHelperSuite ComfyUI-KJNodes"
EXTRA_PIP="imageio-ffmpeg av einops"
