# DESC: Create video — text-to-video, image-to-video, extension
#
# Image-to-video is far more controllable than text-to-video: the still anchors
# identity and composition. Use extension rather than long single passes.
NODES=(
  "ComfyUI-VideoHelperSuite|https://github.com/Kosinkadink/ComfyUI-VideoHelperSuite"
  "ComfyUI-KJNodes|https://github.com/kijai/ComfyUI-KJNodes"
  "ComfyUI-WanVideoWrapper|https://github.com/kijai/ComfyUI-WanVideoWrapper"
)
REQUIRED_NODES="ComfyUI-VideoHelperSuite ComfyUI-KJNodes ComfyUI-WanVideoWrapper"
EXTRA_PIP="imageio-ffmpeg av einops omegaconf accelerate"

# Shared Wan components. The generation checkpoint itself is a deliberate
# choice -- t2v, i2v and their sizes differ a lot -- so pick one and add it:
#   Comfy-Org/Wan_2.2_ComfyUI_Repackaged  split_files/diffusion_models/
MODELS=(
  "Comfy-Org/Wan_2.2_ComfyUI_Repackaged|split_files/text_encoders/umt5_xxl_fp8_e4m3fn_scaled.safetensors|models/text_encoders|umt5_xxl_fp8_e4m3fn_scaled.safetensors|6000000000"
  "Comfy-Org/Wan_2.2_ComfyUI_Repackaged|split_files/vae/wan_2.1_vae.safetensors|models/vae|wan_2.1_vae.safetensors|220000000"
  "Comfy-Org/Wan_2.2_ComfyUI_Repackaged|split_files/vae/wan2.2_vae.safetensors|models/vae|wan2.2_vae.safetensors|400000000"
)
MODELS_NOTE="Text encoder and VAEs only. Add a diffusion model from Comfy-Org/Wan_2.2_ComfyUI_Repackaged."
