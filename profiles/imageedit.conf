# DESC: Image editing — inpaint, relight, identity, control, restore
#
# Inpaint-CropAndStitch works at full resolution on a crop then stitches back,
# which is the same "spend your pixels on the subject" principle as video.
NODES=(
  "ComfyUI-KJNodes|https://github.com/kijai/ComfyUI-KJNodes"
  "ComfyUI_essentials|https://github.com/cubiq/ComfyUI_essentials"
  "ComfyUI-Inpaint-CropAndStitch|https://github.com/lquesada/ComfyUI-Inpaint-CropAndStitch"
  "comfyui_controlnet_aux|https://github.com/Fannovel16/comfyui_controlnet_aux"
  "ComfyUI-RMBG|https://github.com/1038lab/ComfyUI-RMBG"
  "facerestore_cf|https://github.com/mav-rik/facerestore_cf"
)
REQUIRED_NODES="ComfyUI-KJNodes ComfyUI_essentials"
EXTRA_PIP="transformers accelerate"

MODELS=()
MODELS_NOTE="Pick a base checkpoint yourself (Qwen-Image-Edit, Flux, SDXL) — they differ hugely in size. RMBG and controlnet_aux self-download."
