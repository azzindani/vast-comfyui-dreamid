# DESC: Voice cloning, TTS, stem separation, music
#
# Lip sync is usually unnecessary: if a swap preserves the original mouth
# movement and you keep the source audio, sync is free. You only need it when
# replacing the dialogue.
NODES=(
  "ComfyUI-VideoHelperSuite|https://github.com/Kosinkadink/ComfyUI-VideoHelperSuite"
  "TTS-Audio-Suite|https://github.com/diodiogod/TTS-Audio-Suite"
  "audio-separation-nodes-comfyui|https://github.com/christian-byrne/audio-separation-nodes-comfyui"
)
REQUIRED_NODES="ComfyUI-VideoHelperSuite"
EXTRA_PIP="soundfile librosa"
